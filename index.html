<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PICO Games — Your PNGs</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif;text-align:center}
main{width:min(900px,94vw);margin:auto;padding:20px 0}
h1{margin:0 0 6px}p{color:#aaa}
button,input{border:1px solid #444;background:#222;color:#fff;border-radius:9px;padding:11px 14px;margin:5px}
input{max-width:90%}
.game-container{margin:18px auto;background:#000;border:2px solid #333;border-radius:14px;overflow:hidden;width:min(640px,94vw);aspect-ratio:1}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none}
.status{min-height:24px;color:#aaa}
</style>
</head>
<body>
<main>
<h1>🎮 PICO Games</h1>
<p>Select your own <b>.p8.png</b> cartridge. The game stays in your browser.</p>
<input id="cart-file" type="file" accept=".p8.png,image/png">
<button id="load-button">Load PICO-8 PNG</button>
<div class="status" id="status">Emulator v7 • deployment test…</div>
<div class="game-container"><div id="no-cart-message">Choose a .p8.png file above.</div></div>
<script>
addEventListener("error",e=>{const s=document.getElementById("status");if(s)s.textContent="JavaScript error: "+(e.message||"module failed to load")});
addEventListener("unhandledrejection",e=>{const s=document.getElementById("status");if(s)s.textContent="JavaScript error: "+(e.reason?.message||String(e.reason||"module failed to load"))});
</script>
<p>Keyboard: Arrow keys, Z/X/C/V. Compatibility depends on this open-source PICO-8-style emulator.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script type="module" src="./src/main.js?v=7"></script>
</body>
</html>
